name: CI

# Replaces a workflow that could not have been passing: it called
# `npm run prettier:check` and `npm run test:ci` (neither script existed), ran
# pytest against zero tests, and built a Docker `production` stage that was never
# defined. Everything below is a step that actually runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path filters so an apps/api change doesn't run frontend jobs, and vice versa.
  # This is how a monorepo gets independent CI without separate repos.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
            site:
              - 'apps/site/**'
              - 'packages/**'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: replo
          POSTGRES_PASSWORD: replo
          POSTGRES_DB: replo_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    env:
      POSTGRES_USER: replo
      POSTGRES_PASSWORD: replo
      POSTGRES_DB: replo_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      # Config validation requires >=32 chars and rejects known placeholders,
      # so CI needs a real-shaped value. Not a secret — this DB is ephemeral.
      JWT_SECRET_KEY: ci-only-not-a-real-secret-abcdefghijklmnop
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # --frozen fails if uv.lock is stale rather than silently resolving
      # something different from what developers have installed.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # Report-only: ~95 pre-existing errors in code Phase 2 rewrites. Becomes
      # blocking per-module as each is converted, rather than dumping a wall of
      # errors on code nobody is about to touch.
      - name: Type check (mypy, non-blocking)
        run: uv run mypy app || true

      # The step the old workflow was missing entirely — proves migrations apply
      # to a clean database before they ever reach production.
      - name: Migrations apply to a clean database
        run: uv run alembic upgrade head

      # Guards against the migration drifting from the models. If autogenerate
      # finds anything after upgrade head, someone changed a model without
      # generating a migration.
      - name: No un-migrated model changes
        run: |
          uv run alembic check

      - name: Import smoke test
        run: |
          uv run python -c "
          import app.models
          from app.main import app
          from app.workers.worker import WorkerSettings
          assert len(app.routes) > 10, 'routes missing'
          print(f'OK: {len(app.routes)} routes')
          "

      # `|| [ $? -eq 5 ]` tolerates exit code 5 = 'no tests collected'. There are
      # no tests yet (Phase 6). Remove this escape hatch once there are.
      - name: Tests
        run: uv run pytest -q || [ $? -eq 5 ]

  # apps/web and apps/site do not exist yet (Phases 4 and 5). apps/web-legacy is
  # deliberately excluded from CI — it is reference code, not live code.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "apps/web lands in Phase 4."
