services:
  postgres:
    image: postgres:15-alpine
    container_name: replo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutorial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorial_password}
      POSTGRES_DB: ${POSTGRES_DB:-tutorial_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorial_user} -d ${POSTGRES_DB:-tutorial_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - replo-network

  redis:
    image: redis:7-alpine
    container_name: replo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - replo-network

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: replo-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tutorial_user}:${POSTGRES_PASSWORD:-tutorial_password}@postgres:5432/${POSTGRES_DB:-tutorial_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - replo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: replo-worker
    restart: unless-stopped
    command: python run_worker.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tutorial_user}:${POSTGRES_PASSWORD:-tutorial_password}@postgres:5432/${POSTGRES_DB:-tutorial_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - replo-network

  # Pre-rewrite frontend. Replaced by apps/web (Rsbuild) in Phase 4 and
  # apps/site (Next) in Phase 5. Kept running so the app stays demoable.
  frontend:
    build:
      context: ./apps/web-legacy
      dockerfile: Dockerfile
    container_name: replo-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks:
      - replo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  replo-network:
    driver: bridge
