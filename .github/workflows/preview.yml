# PR previews via `wrangler versions upload`: uploads a new Workers version and
# returns a preview URL without routing any production traffic to it.
#
# Requires the same repo secrets as deploy.yml: CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. Without them the job fails — PRs from forks do not
# receive secrets, which is expected.

name: preview

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/product/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/preview.yml'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      # OpenNext transforms the Next build into .open-next/ (it runs next build itself).
      - run: pnpm --filter @replo/product exec opennextjs-cloudflare build

      - name: Upload product preview version
        working-directory: apps/product
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload 2>&1 | tee /tmp/product-upload.log
          grep -oE 'https://[^ ]+\.workers\.dev' /tmp/product-upload.log | tail -n 1 > /tmp/product-url.txt || true

      - name: Upload api preview version
        working-directory: apps/api
        run: |
          set -o pipefail
          pnpm exec wrangler versions upload -c wrangler.jsonc 2>&1 | tee /tmp/api-upload.log
          grep -oE 'https://[^ ]+\.workers\.dev' /tmp/api-upload.log | tail -n 1 > /tmp/api-url.txt || true

      - name: Comment preview URLs on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const read = (p) => fs.readFileSync(p, 'utf8').trim();
            const product = read('/tmp/product-url.txt');
            const api = read('/tmp/api-url.txt');
            const lines = [
              '## Preview versions',
              '',
              product ? `- **product**: ${product}` : '- **product**: version uploaded (check the "Upload product preview version" step log for the URL)',
              api ? `- **api**: ${api}` : '- **api**: version uploaded (check the "Upload api preview version" step log for the URL)',
              '',
              'These are version preview URLs — production traffic is unaffected. Promote with `wrangler versions deploy`.',
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
