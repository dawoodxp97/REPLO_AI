# Cloudflare deploy pipeline.
#
# One-time manual setup (repo admin):
#   1. Cloudflare API token — create a custom token with template
#      "Edit Cloudflare Workers" plus: Workers Scripts:Edit, D1:Edit,
#      Hyperdrive:Edit, R2:Edit. Account Resources: this account.
#   2. Repo secrets: CLOUDFLARE_API_TOKEN (that token),
#      CLOUDFLARE_ACCOUNT_ID (Cloudflare dashboard → Workers & Pages → Account ID).
#   3. Repo secret: NEON_DATABASE_URL (Neon Postgres 17 connection string;
#      the `migrate` job uses it via the DATABASE_URL env var).
#
# Staged rollout follow-up: for api/product, `wrangler versions upload` +
# `wrangler versions deploy` would let you push a new version and promote it
# only after smoke checks (see preview.yml). Plain `wrangler deploy` is used
# here for simplicity; wrangler-action passes the command through, so a staged
# rollout is a matter of swapping those commands in.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: replo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d replo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/replo
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/replo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4, version comes from package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build --affected
      - run: pnpm --filter @replo/evals smoke

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    env:
      # Idempotent (applies each DDL file at most once), so it is safe to run
      # on every push to main rather than filtering to db/ddl changes.
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @replo/api db:migrate

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      # OpenNext transforms the Next build into .open-next/ (it runs next build itself).
      - run: pnpm --filter @replo/product exec opennextjs-cloudflare build

      - name: Deploy landing (Workers static assets)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: apps/landing
          command: deploy

      - name: Deploy product (OpenNext → Workers)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: apps/product
          command: deploy

      - name: Deploy api (HTTP)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: apps/api
          command: deploy -c wrangler.jsonc

      - name: Deploy api pipeline (Workflows + cron)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: apps/api
          command: deploy -c wrangler.pipeline.jsonc
